name: Build and push docker image (production)

on:
  # only "published": a plain `release` trigger also fires on "created" and "released", which
  # built and pushed the image three times with different digests, so OpenShift redeployed twice
  release:
    types: [published]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to version helsinki
        uses: docker/login-action@v3
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
      
      - name: Build and push the Docker image
        run: |-
           docker build -t registry.version.helsinki.fi/toska/openshift/kontit/finlex:production .
           docker push registry.version.helsinki.fi/toska/openshift/kontit/finlex:production

