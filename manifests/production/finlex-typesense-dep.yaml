apiVersion: apps/v1
kind: Deployment
metadata:
  name: finlex-typesense-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finlex-typesense
  template:
    metadata:
      labels:
        app: finlex-typesense
    spec:
      containers:
        - name: finlex-typesense
          image: typesense/typesense:28.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8108
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: finlex-lukija-config
                  key: TYPESENSE_API_KEY
            - name: TYPESENSE_DATA_DIR
              value: "/data"
          volumeMounts:
            - name: finlex-typesense-volume
              mountPath: /data
          # Typesense answers /health with an error while it loads collections from disk after a
          # restart (several minutes with two index sets during an update); without this the
          # liveness probe kills it mid-load, forever.
          startupProbe:
            httpGet:
              path: /health
              port: 8108
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: 8108
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8108
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          # The update builds the new index next to the live one, so Typesense needs about twice its
          # normal ~1.1 GiB for a while: with a 1200Mi limit it was OOM-killed (2026-11-14).
          resources:
            limits:
              memory: "3Gi"
              cpu: "1000m"
            requests:
              memory: "2500Mi"
              cpu: "1000m"
      volumes:
        - name: finlex-typesense-volume
          persistentVolumeClaim:
            claimName: finlex-typesense-claim
